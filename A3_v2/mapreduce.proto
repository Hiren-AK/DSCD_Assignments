syntax = "proto3";

package mapreduce;

import "google/protobuf/empty.proto";

service MapperService {
    rpc ProcessInput(MapperTask) returns (MapperResponse) {}
    rpc FetchIntermediateData(FetchRequest) returns (FetchResponse) {}
    rpc CheckHealth(google.protobuf.Empty) returns (HealthStatus) {}
}

service ReducerService{
    rpc ProcessIntermediateData(ReducerTask) returns (ReducerResponse) {}
    rpc CheckHealth(google.protobuf.Empty) returns (HealthStatus) {}
}

message HealthStatus {
    bool is_alive = 1;
    string status = 2;
}

// Message to hold a list of doubles (e.g., centroid coordinates)
message Centroid {
    repeated double coordinates = 1;
}

// Mapper task details sent by the master
message MapperTask {
    repeated double centroids = 1; // List of centroids
    repeated string input_data_paths = 2;   // Paths to input data files (used in multiple file scenarios)
    string single_input_file = 3;           // Single input file path (used in single file scenario)
    int32 start_index = 4;                  // Starting index for processing in single file scenario
    int32 end_index = 5;                    // Ending index for processing in single file scenario
    string task_id = 6;                     // Task ID
    int32 num_partitions = 7;                // R, number of partitions, number of reducers
}

// Response from mappers
message MapperResponse {
    bool success = 1;               // Indicates if the task was successful
    string message = 2;             // Error message or success confirmation
    string task_id = 3;              // Task ID for tracking
}

// Reducer tasks details sent by the master
message ReducerTask {
    repeated string data_paths = 1; // Paths to data files that need to be processed
    repeated int32 keys = 2;        // List of centroid keys this reducer will handle
    string task_id = 3;              // Task ID for tracking
}

// Response from reducers
message ReducerResponse {
    bool success = 1;
    string message = 2;
    map<int32, Centroid> centroids = 3; // Using the Centroid message for the map values
    string task_id = 4;
}

message FetchRequest {
    repeated int32 keys = 1; // Centroid indices requested by the reducer
    string task_id = 2;      // Task ID to identify the request
    string data_paths = 3; // Paths to data files to fetch
} 

message DataPoint {
    repeated double features = 1; // Features of the data point
}

message FetchResponse {
    message KeyValuePair {
        int32 key = 1;           // Centroid ID
        repeated DataPoint values = 2;  // Data points associated with the centroid
    }
    repeated KeyValuePair key_values = 1; // List of key-value pairs
}